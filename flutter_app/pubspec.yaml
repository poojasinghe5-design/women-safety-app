name: women_safety_app
description: AI-Powered Women Safety Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Location
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  geocoding: ^3.0.0

  # Audio
  record: ^6.0.0
  audioplayers: ^6.1.0

  # Voice Activation
  speech_to_text: ^7.0.0

  # Communication
  url_launcher: ^6.3.1
  flutter_phone_direct_caller: ^2.2.0

  # Sensors
  sensors_plus: ^4.0.2
  battery_plus: ^6.0.3
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8

  # UI
  flutter_riverpod: ^2.6.1
  go_router: ^14.3.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/